<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUMPA — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d17;--surface:#111b30;--surface-2:#16213a;--line:#22304c;
  --text:#e9eef7;--muted:#8fa0bd;--blue:#4f8cff;--cyan:#31d5c8;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
*{box-sizing:inherit;}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(800px 500px at 90% 0%, rgba(79,140,255,0.14), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(49,213,200,0.10), transparent 60%),
    var(--bg);
}
h1{font-family:'Space Grotesk';font-weight:700;letter-spacing:-0.01em;margin:0;}
a{color:var(--blue);text-decoration:none;}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 32px;box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);}
.brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-bottom:28px;}
.dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--blue),var(--cyan));}
h1.title{font-size:22px;margin-bottom:6px;}
.sub{color:var(--muted);font-size:14px;margin-bottom:26px;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
input{
  width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);font-size:14px;margin-bottom:16px;
}
input:focus{outline:2px solid var(--blue);outline-offset:1px;}
.row-between{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:-6px 0 20px;color:var(--muted);}
.btn-primary{
  width:100%;padding:12px;border-radius:9px;border:none;font-size:14.5px;font-weight:600;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04101c;cursor:pointer;
}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12.5px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
.btn-ghost{
  width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:transparent;
  color:var(--text);font-size:14px;cursor:pointer;
}
.foot{text-align:center;margin-top:24px;font-size:13.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span>NUMPA</div>
  <h1 class="title">Sign in</h1>
  <p class="sub">Pick up where you left off with your datasets and pipelines.</p>
  <form onsubmit="return false;">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@company.com">
    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="••••••••">
    <div class="row-between"><span></span><a href="#">Forgot password?</a></div>
    <button class="btn-primary" type="submit">Sign in</button>
  </form>
  <div class="divider">or</div>
  <button class="btn-ghost">Continue with Google</button>
  <div class="foot">Don't have an account? <a href="#">Sign up</a></div>
</div>
</body>
</html>
